; Mounted by the module into the eLabFTW container at
; /etc/php84/conf.d/zz-ns8-hardening.ini (read by php-fpm and the CLI after
; the php.ini the image generates at start-up).
;
; CVE-2026-109619 (GHSA-6wmf-4rv5-p3rp, RCE via stale global state in PHP):
; the session upload progress feature produced and consumed the stale state in
; the demonstrated session lifecycle case. Turning it off is the configuration
; mitigation the advisory names for that case, and eLabFTW upstream does the
; same in its php.ini (upstream commit cb047d97). It does not replace a fixed PHP
; release (8.4.27 or later); eLabFTW does not use the feature.
session.upload_progress.enabled = 0
